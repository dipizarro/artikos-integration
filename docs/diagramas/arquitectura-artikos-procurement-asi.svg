  <text x="190" y="298" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Confirmación y resultado</text>
  <rect x="470" y="150" rx="16" ry="16" width="390" height="235" fill="#ffffff" stroke="#335f8a" stroke-width="3" filter="url(#shadow)"/>
