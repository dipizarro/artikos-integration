    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#f7f9fc"/>
  <text x="70" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d">Arquitectura general — Integración Artikos / Procurement / ASI</text>
  <text x="70" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5e6c84">Vista lógica as-built del flujo productivo y límites de responsabilidad</text>
  <rect x="70" y="190" rx="14" ry="14" width="240" height="140" fill="#ffffff" stroke="#8aa4c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="238" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172b4d">Artikos</text>
