  <line x1="510" y1="258" x2="820" y2="258" stroke="#d8dee9"/>
  <text x="520" y="292" font-family="Arial" font-size="16" fill="#425466">• REST API de inicio</text>
  <text x="520" y="320" font-family="Arial" font-size="16" fill="#425466">• Spring Batch / orquestación</text>
  <text x="520" y="348" font-family="Arial" font-size="16" fill="#425466">• Mapping / homologación / idempotencia</text>
