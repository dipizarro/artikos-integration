  <text x="1170" y="298" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Persistencia documental</text>
  <rect x="1010" y="510" rx="14" ry="14" width="320" height="135" fill="#ffffff" stroke="#8aa4c0" stroke-width="2" filter="url(#shadow)"/>
