  <text x="1192" y="425" font-family="Arial" font-size="15" font-weight="700" fill="#425466">Persistencia</text>
  <text x="1192" y="448" font-family="Arial" font-size="13" fill="#5e6c84">responsabilidad Procurement</text>
  <line x1="665" y1="385" x2="665" y2="505" stroke="#425466" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="690" y="450" font-family="Arial" font-size="15" font-weight="700" fill="#425466">JDBC / JPA</text>
  <line x1="860" y1="577" x2="1010" y2="577" stroke="#425466" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="935" y="560" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#425466">Oracle</text>
  <rect x="70" y="505" rx="14" ry="14" width="250" height="145" fill="#eef4fa" stroke="#8aa4c0" stroke-width="2"/>
  <text x="195" y="548" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172b4d">Runtime / Config</text>
  <text x="195" y="582" text-anchor="middle" font-family="Arial" font-size="15" fill="#425466">Kubernetes / Flux</text>
  <text x="195" y="609" text-anchor="middle" font-family="Arial" font-size="15" fill="#425466">Azure App Config / Key Vault</text>
  <line x1="320" y1="577" x2="470" y2="577" stroke="#8aa4c0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="70" y="710" font-family="Arial" font-size="14" fill="#6b778c">Nota: el adapter no inserta directamente documentos contables finales en ASI; esa responsabilidad pertenece a Procurement.</text>
