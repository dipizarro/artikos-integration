spring.profiles.active=test
spring.application.name=atk-nomina-batch
app.diagnostics.enabled=true
app.admin.enabled=true
app.endpoints.operations.enabled=true
app.health.database-time-query=SELECT CURRENT_TIMESTAMP FROM DUAL

app.datasource.url=jdbc:h2:mem:atk_nomina_app_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.username=sa
app.datasource.password=
app.datasource.driver-class-name=org.h2.Driver

batch.datasource.url=jdbc:h2:mem:atk_nomina_batch_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
batch.datasource.username=sa
batch.datasource.password=
batch.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

atk.batch.simulation-nominas=1000
atk.batch.default-max-nominas=50
atk.batch.max-nominas-per-run=50
atk.batch.simulation-iterations=100
atk.batch.chunk-size=20
atk.batch.real.chunk-size=1
atk.batch.sample-file=classpath:samples/ZSVIDA_Nom15960.xml

