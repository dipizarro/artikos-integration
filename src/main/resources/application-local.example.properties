spring.application.name=atk-nomina-batch-local

app.diagnostics.enabled=${APP_DIAGNOSTICS_ENABLED:true}
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.endpoints.operations.enabled=${APP_ENDPOINTS_OPERATIONS_ENABLED:true}
app.config.validation.strict=${APP_CONFIG_VALIDATION_STRICT:false}
app.health.database-time-query=${APP_HEALTH_DATABASE_TIME_QUERY:SELECT CURRENT_TIMESTAMP FROM DUAL}

app.datasource.url=${APP_DATASOURCE_URL:jdbc:oracle:thin:@host:1521:sid}
app.datasource.username=${APP_DATASOURCE_USERNAME:REPLACE_ME}
app.datasource.password=${APP_DATASOURCE_PASSWORD:REPLACE_ME}
app.datasource.driver-class-name=${APP_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}

batch.datasource.url=${BATCH_DATASOURCE_URL:jdbc:oracle:thin:@host:1521:sid}
batch.datasource.username=${BATCH_DATASOURCE_USERNAME:REPLACE_ME}
batch.datasource.password=${BATCH_DATASOURCE_PASSWORD:REPLACE_ME}
batch.datasource.driver-class-name=${BATCH_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.OracleDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_HIBERNATE_FORMAT_SQL:true}

spring.batch.job.enabled=${SPRING_BATCH_JOB_ENABLED:false}
spring.batch.jdbc.initialize-schema=${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:never}
spring.batch.jdbc.table-prefix=${SPRING_BATCH_JDBC_TABLE_PREFIX:BATCH_}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

atk.batch.simulation-nominas=${ATK_BATCH_SIMULATION_NOMINAS:1000}
atk.batch.default-max-nominas=${ATK_BATCH_DEFAULT_MAX_NOMINAS:50}
atk.batch.max-nominas-per-run=${ATK_BATCH_MAX_NOMINAS_PER_RUN:50}
atk.batch.simulation-iterations=${ATK_BATCH_SIMULATION_ITERATIONS:100}
atk.batch.chunk-size=${ATK_BATCH_CHUNK_SIZE:25}
atk.batch.real.chunk-size=${ATK_BATCH_REAL_CHUNK_SIZE:1}
atk.batch.sample-file=${ATK_BATCH_SAMPLE_FILE:classpath:samples/ZSVIDA_Nom15960.xml}

artikos.http.connect-timeout-ms=${ARTIKOS_HTTP_CONNECT_TIMEOUT_MS:5000}
artikos.http.read-timeout-ms=${ARTIKOS_HTTP_READ_TIMEOUT_MS:30000}
artikos.retry.enabled=${ARTIKOS_RETRY_ENABLED:true}
artikos.retry.max-attempts=${ARTIKOS_RETRY_MAX_ATTEMPTS:3}
artikos.retry.backoff-ms=${ARTIKOS_RETRY_BACKOFF_MS:1000}
artikos.source.mode=${ARTIKOS_SOURCE_MODE:local-xml}
artikos.source.local-xml-path=${ARTIKOS_SOURCE_LOCAL_XML_PATH:classpath:samples/ZSGRALES_Nom15961_v2.xml}
artikos.confirm.enabled=${ARTIKOS_CONFIRM_ENABLED:false}
artikos.result.enabled=${ARTIKOS_RESULT_ENABLED:false}

artikos.qa.endpoints.nomina-url=${ARTIKOS_NOMINA_URL:REPLACE_ME}
artikos.qa.endpoints.connector-url=${ARTIKOS_CONNECTOR_URL:REPLACE_ME}
artikos.qa.soap-action=${ARTIKOS_SOAP_ACTION:}
artikos.qa.nomina-soap-action=${ARTIKOS_NOMINA_SOAP_ACTION:"AtkWs_DocExtractor/EjecutaTrx"}
artikos.qa.connector-soap-action=${ARTIKOS_CONNECTOR_SOAP_ACTION:"AtkWs_DocConnectorB2B/EjecutaTrx"}

procurement.mapping.document-type=${PROCUREMENT_MAPPING_DOCUMENT_TYPE:CMP}
procurement.mapping.cod-sistem=${PROCUREMENT_MAPPING_COD_SISTEM:CM}
procurement.mapping.val-tip-cambio=${PROCUREMENT_MAPPING_VAL_TIP_CAMBIO:1}
procurement.mapping.pct-dscnto=${PROCUREMENT_MAPPING_PCT_DSCNTO:0}
procurement.mapping.mto-dscnto=${PROCUREMENT_MAPPING_MTO_DSCNTO:0}
procurement.mapping.pct-iva=${PROCUREMENT_MAPPING_PCT_IVA:19}

procurement.client.enabled=${PROCUREMENT_CLIENT_ENABLED:true}
procurement.client.base-url=${PROCUREMENT_BASE_URL:http://localhost:8081}
procurement.client.document-path=${PROCUREMENT_DOCUMENT_PATH:/api/v1/document}
procurement.client.connect-timeout-ms=${PROCUREMENT_CONNECT_TIMEOUT_MS:5000}
procurement.client.read-timeout-ms=${PROCUREMENT_READ_TIMEOUT_MS:30000}
procurement.integration.enabled=${PROCUREMENT_INTEGRATION_ENABLED:false}

